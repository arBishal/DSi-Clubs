name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  ci:
    name: format · lint · type-check · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Must run first: backend/frontend type-check and backend tests
      # resolve `shared` from its dist/.
      - name: Build shared
        run: pnpm --filter shared build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:ci

      - name: Type check
        run: pnpm type-check

      - name: Test shared
        run: pnpm --filter shared test

      - name: Test backend
        run: pnpm --filter backend test

      - name: Build frontend
        run: pnpm --filter frontend build
